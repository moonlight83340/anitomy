name: Build and Test

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake --preset=ninja-multi

      # === Step 1 : Test on current branch ===

      - name: Build current commit
        run: cmake --build --preset=ninja-${{ matrix.build_type }}

      - name: Copy data.json to execution directory
        run: cp test/data.json ./bin/${{ matrix.build_type }}/
        shell: bash

      - name: Run test on current commit
        run: |
          cd ./bin/${{ matrix.build_type }}/
          ./test.exe --test-data > test-data-output-current-${{ matrix.build_type }}.txt
        shell: bash

      - name: Save current test output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-data-output-current-${{ matrix.build_type }}
          path: ./bin/${{ matrix.build_type }}/test-data-output-current-${{ matrix.build_type }}.txt

      # === Step 2 : Test on previous commit or merge-base for PR ===

      - name: Checkout the base branch (for PRs) or previous commit (for push)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR: checkout base branch (merge-base)
            git fetch origin
            git checkout $(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})
          else
            # push: checkout previous commit (HEAD~1)
            git checkout HEAD~1
          fi
        shell: bash

      - name: Configure CMake
        run: cmake --preset=ninja-multi
        shell: bash

      - name: Build previous commit or base branch
        run: cmake --build --preset=ninja-${{ matrix.build_type }}
        shell: bash

      - name: Copy data.json to execution directory (previous)
        run: cp test/data.json ./bin/${{ matrix.build_type }}/
        shell: bash

      - name: Run test on previous commit or base branch
        run: |
          cd ./bin/${{ matrix.build_type }}/
          ./test.exe --test-data > test-data-output-prev-${{ matrix.build_type }}.txt
        shell: bash

      - name: Save previous test output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-data-output-prev-${{ matrix.build_type }}
          path: ./bin/${{ matrix.build_type }}/test-data-output-prev-${{ matrix.build_type }}.txt

      # === Step 3 : Compare ===

      - name: Download current test output
        uses: actions/download-artifact@v4
        with:
          name: test-data-output-current-${{ matrix.build_type }}

      - name: Compare test outputs and detect differences
        id: compare
        run: |
          diff -u ./bin/${{ matrix.build_type }}/test-data-output-prev-${{ matrix.build_type }}.txt test-data-output-current-${{ matrix.build_type }}.txt > diff-${{ matrix.build_type }}.txt || true
          if [ -s diff-${{ matrix.build_type }}.txt ]; then
            echo "non_empty=true" >> $GITHUB_OUTPUT
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            cat diff-${{ matrix.build_type }}.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
                else
            echo "non_empty=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload diff
        if: steps.compare.outputs.non_empty == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-output-diff-${{ matrix.build_type }}
          path: diff-${{ matrix.build_type }}.txt

      # === Step 4 : Comment if diff in case of PR ===

      - name: Comment diff on PR
        if: github.event_name == 'pull_request' && steps.compare.compare.non_empty == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🔍 Test output difference detected for **${{ matrix.build_type }}**:

            ```diff
            ${{ steps.compare.outputs.diff }}
            ```

      # === Step 5 : Fail if diff ===

      - name: Fail if diff exists
        run: |
          if [ -s diff-${{ matrix.build_type }}.txt ]; then
            echo "::error ::Test output differs for ${{ matrix.build_type }}"
            exit 1
          fi
        shell: bash
